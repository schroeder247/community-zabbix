name: Feature request
description: Suggest a capability or improvement.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: The admin/developer workflow that is hard today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What the cmdlet/API should look like. Zabbix API method if known.
