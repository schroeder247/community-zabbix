# The EF store's own throwaway database (never a Zabbix one), on 127.0.0.1:55432:
#   ZABBIX_TEST_POSTGRES='Host=127.0.0.1;Port=55432;Database=zbxtest;Username=zbxtest;Password=zbxtest;Timeout=3'
apiVersion: v1
kind: Pod
metadata:
  name: zbxtest-pg
  labels:
    app: zbxlab
spec:
  restartPolicy: Always
  containers:
    - name: db
      # postgres:16-alpine
      image: docker.io/library/postgres@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
      env:
        - { name: POSTGRES_USER, value: zbxtest }
        - { name: POSTGRES_PASSWORD, value: zbxtest }
        - { name: POSTGRES_DB, value: zbxtest }
      ports:
        - { containerPort: 5432, hostPort: 55432 }
